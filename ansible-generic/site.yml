---
# =============================================================================
# Master Playbook — Run everything (packages + patching + config files)
# =============================================================================
# This is an orchestrator that imports all individual playbooks.
# For targeted runs, use the individual playbooks directly:
#
#   ansible-playbook packages.yml                  # packages only
#   ansible-playbook patch.yml                     # OS patching only
#   ansible-playbook config.yml                    # config files only
#   ansible-playbook site.yml                      # everything
#
# All playbooks support:
#   --limit "linux"                                # target one group
#   --limit "siem.ldil.vle.fi"                     # target one host
#   --check --diff                                 # dry-run
# =============================================================================

- import_playbook: packages.yml
- import_playbook: config.yml
- import_playbook: patch.yml
