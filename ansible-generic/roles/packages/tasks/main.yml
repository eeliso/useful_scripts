---
# =============================================================================
# Role: packages — Install packages on Linux and Windows hosts
# =============================================================================
# Handles two types of packages:
#   1. Repo-based packages (filebeat, etc.) — installed via yum/apt/Chocolatey
#   2. FireEye agent — installed from a local .tgz on the Ansible control node
# =============================================================================

# -----------------------------------------------------------------------------
# Linux — repo-based packages (yum/apt)
# -----------------------------------------------------------------------------
- name: Install repo-based packages on Linux
  when: ansible_os_family in ['Debian', 'RedHat']
  block:
    - name: Update apt cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

    - name: Install Linux packages from repos
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop: "{{ packages | default([]) | reject('equalto', 'fireeye-agent') | list }}"
      register: linux_package_result

    - name: Display Linux package installation results
      ansible.builtin.debug:
        msg: "Installed {{ linux_package_result.results | selectattr('changed', 'equalto', true) | list | length }} repo package(s)"
      when: linux_package_result.results | default([]) | length > 0

# -----------------------------------------------------------------------------
# Linux — FireEye agent from local .tgz
# -----------------------------------------------------------------------------
- name: Install FireEye agent on Linux
  when:
    - ansible_os_family in ['Debian', 'RedHat']
    - "'fireeye-agent' in (packages | default([]))"
    - fireeye_package is defined
  block:
    - name: Create FireEye install directory
      ansible.builtin.file:
        path: /tmp/fireeye_install
        state: directory
        mode: "0755"

    - name: Copy FireEye .tgz to remote host
      ansible.builtin.copy:
        src: "{{ fireeye_package }}"
        dest: /tmp/fireeye_install/fireeye-agent.tgz
        mode: "0644"

    - name: Extract FireEye .tgz
      ansible.builtin.shell:
        cmd: tar xzf /tmp/fireeye_install/fireeye-agent.tgz -C /tmp/fireeye_install

    - name: Find installer script or RPM in extracted files
      ansible.builtin.find:
        paths: /tmp/fireeye_install
        patterns: ["*.rpm", "*.deb", "install.sh", "agent_install.sh"]
        recurse: true
      register: fireeye_installer_files

    - name: Install FireEye RPM package (RedHat)
      ansible.builtin.yum:
        name: "{{ item.path }}"
        state: present
        disable_gpg_check: true
      loop: "{{ fireeye_installer_files.files | selectattr('path', 'match', '.*\\.rpm$') | list }}"
      when: ansible_os_family == 'RedHat'

    - name: Install FireEye DEB package (Debian)
      ansible.builtin.apt:
        deb: "{{ item.path }}"
        state: present
      loop: "{{ fireeye_installer_files.files | selectattr('path', 'match', '.*\\.deb$') | list }}"
      when: ansible_os_family == 'Debian'

    - name: Run FireEye install script (if present, no RPM/DEB found)
      ansible.builtin.shell:
        cmd: "bash {{ item.path }}"
        chdir: /tmp/fireeye_install
      loop: "{{ fireeye_installer_files.files | selectattr('path', 'match', '.*install.*\\.sh$') | list }}"
      when: fireeye_installer_files.files | selectattr('path', 'match', '.*\\.(rpm|deb)$') | list | length == 0

    - name: Clean up FireEye install directory
      ansible.builtin.file:
        path: /tmp/fireeye_install
        state: absent

# -----------------------------------------------------------------------------
# Windows — repo-based packages via Chocolatey
# -----------------------------------------------------------------------------
- name: Install repo-based packages on Windows
  when: ansible_os_family == 'Windows'
  block:
    - name: Ensure TLS 1.2 and install Chocolatey
      ansible.windows.win_shell: |
        # Force TLS 1.2 for downloads
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

        # Check if Chocolatey is already installed
        if (Get-Command choco -ErrorAction SilentlyContinue) {
            Write-Host "Chocolatey is already installed"
            exit 0
        }

        # Check .NET Framework version to decide Chocolatey version
        $netRelease = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full' -ErrorAction SilentlyContinue).Release
        if ($netRelease -ge 528040) {
            # .NET 4.8+ present — install latest Chocolatey
            $installScript = (New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1')
            Invoke-Expression $installScript
        } else {
            # .NET < 4.8 — install Chocolatey 1.x
            $env:chocolateyVersion = '1.4.0'
            $installScript = (New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1')
            Invoke-Expression $installScript
        }
      register: choco_install
      changed_when: "'already installed' not in choco_install.stdout"

    - name: Install Windows packages via Chocolatey
      ansible.windows.win_shell: |
        # Force TLS 1.2 for any package downloads
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        choco install {{ item }} -y --no-progress
      loop: "{{ packages | default([]) | reject('equalto', 'fireeye-agent') | list }}"
      register: win_package_result
      changed_when: "'installed 0/' not in win_package_result.stdout | default('') | lower"
      failed_when:
        - win_package_result.rc != 0
        - "'already installed' not in win_package_result.stdout | default('') | lower"

    - name: Display Windows package installation results
      ansible.builtin.debug:
        msg: "Processed {{ packages | default([]) | reject('equalto', 'fireeye-agent') | list | length }} package(s)"
      when: packages | default([]) | length > 0

# -----------------------------------------------------------------------------
# Windows — FireEye agent from local .zip
# -----------------------------------------------------------------------------
- name: Install FireEye agent on Windows
  when:
    - ansible_os_family == 'Windows'
    - "'fireeye-agent' in (packages | default([]))"
    - fireeye_package is defined
  block:
    - name: Create FireEye install directory
      ansible.windows.win_file:
        path: 'C:\Temp\fireeye_install'
        state: directory

    - name: Copy FireEye .zip to Windows host
      ansible.windows.win_copy:
        src: "{{ fireeye_package }}"
        dest: 'C:\Temp\fireeye_install\fireeye-agent.zip'

    - name: Extract FireEye .zip on Windows
      community.windows.win_unzip:
        src: 'C:\Temp\fireeye_install\fireeye-agent.zip'
        dest: 'C:\Temp\fireeye_install'

    - name: Find MSI installer in extracted files
      ansible.windows.win_find:
        paths: 'C:\Temp\fireeye_install'
        patterns: ["*.msi"]
        recurse: true
      register: fireeye_msi_files

    - name: Install FireEye MSI package
      ansible.windows.win_package:
        path: "{{ item.path }}"
        state: present
      loop: "{{ fireeye_msi_files.files }}"

    - name: Clean up FireEye install directory
      ansible.windows.win_file:
        path: 'C:\Temp\fireeye_install'
        state: absent
