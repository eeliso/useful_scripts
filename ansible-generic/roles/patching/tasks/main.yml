---
# =============================================================================
# Role: patching — Apply OS updates on Linux and Windows hosts
# =============================================================================

# Skip this role entirely if patching is disabled for the host
- name: Check if patching is enabled
  ansible.builtin.debug:
    msg: "Patching is disabled for this host, skipping."
  when: not (patch | default(true))

# -----------------------------------------------------------------------------
# Linux — Debian/Ubuntu (apt)
# -----------------------------------------------------------------------------
- name: Patch Debian/Ubuntu servers
  when:
    - patch | default(true)
    - ansible_os_family == 'Debian'
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Upgrade all packages (Debian/Ubuntu)
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      register: apt_upgrade_result

    - name: Display apt upgrade results
      ansible.builtin.debug:
        msg: >-
          Upgraded packages: {{ apt_upgrade_result.stdout_lines | default(['No changes']) }}
      when: apt_upgrade_result.changed

    - name: Check if reboot is required (Debian/Ubuntu)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot server if required (Debian/Ubuntu)
      ansible.builtin.reboot:
        reboot_timeout: "{{ patching_reboot_timeout | default(600) }}"
        msg: "Rebooting after OS patching (Ansible)"
      when:
        - patching_auto_reboot | default(true)
        - reboot_required_file.stat.exists

# -----------------------------------------------------------------------------
# Linux — RHEL/CentOS/Rocky (yum/dnf)
# -----------------------------------------------------------------------------
- name: Patch RHEL/CentOS servers
  when:
    - patch | default(true)
    - ansible_os_family == 'RedHat'
  block:
    - name: Upgrade all packages (RHEL/CentOS)
      ansible.builtin.yum:
        name: "*"
        state: latest
        update_cache: true
      register: yum_upgrade_result

    - name: Display yum upgrade results
      ansible.builtin.debug:
        msg: "Yum update completed. Changed: {{ yum_upgrade_result.changed }}"

    - name: Check if reboot is required (RHEL/CentOS)
      ansible.builtin.command: needs-restarting -r
      register: reboot_check
      failed_when: false
      changed_when: false

    - name: Reboot server if required (RHEL/CentOS)
      ansible.builtin.reboot:
        reboot_timeout: "{{ patching_reboot_timeout | default(600) }}"
        msg: "Rebooting after OS patching (Ansible)"
      when:
        - patching_auto_reboot | default(true)
        - reboot_check.rc == 1

# -----------------------------------------------------------------------------
# Windows — Windows Update
# -----------------------------------------------------------------------------
- name: Patch Windows servers
  when:
    - patch | default(true)
    - ansible_os_family == 'Windows'
  block:
    - name: Install Windows updates
      ansible.windows.win_updates:
        category_names: "{{ patching_update_categories | default(['SecurityUpdates', 'CriticalUpdates']) }}"
        state: installed
        reboot: "{{ patching_auto_reboot | default(true) }}"
        reboot_timeout: "{{ patching_reboot_timeout | default(1200) }}"
      register: win_update_result

    - name: Display Windows update results
      ansible.builtin.debug:
        msg: >-
          Installed {{ win_update_result.installed_update_count | default(0) }} update(s).
          Found {{ win_update_result.found_update_count | default(0) }} available update(s).
      when: win_update_result is defined
