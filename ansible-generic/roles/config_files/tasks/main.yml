---
# =============================================================================
# Role: config_files — Distribute configuration files to hosts
# =============================================================================
# Copies files from the local `files/` directory to the remote host.
# Only files listed in the host's `config_files` variable are copied.
# =============================================================================

- name: Include Linux config tasks
  ansible.builtin.include_tasks: linux.yml
  when:
    - ansible_os_family in ['Debian', 'RedHat']
    - config_files | default([]) | length > 0

- name: Include Windows config tasks
  ansible.builtin.include_tasks: windows.yml
  when:
    - ansible_os_family == 'Windows'
    - config_files | default([]) | length > 0
