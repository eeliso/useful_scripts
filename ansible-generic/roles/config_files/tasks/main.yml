---
# =============================================================================
# Role: config_files — Distribute configuration files to hosts
# =============================================================================
# Copies files from the local `files/` directory to the remote host.
# Only files listed in the host's `config_files` variable are copied.
#
# Place your config files in the project root `files/` directory:
#   files/sshd_config
#   files/nginx.conf
#   files/logon_banner.txt
#   etc.
# =============================================================================

# -----------------------------------------------------------------------------
# Linux — ansible.builtin.copy
# -----------------------------------------------------------------------------
- name: Distribute config files to Linux hosts
  when:
    - ansible_os_family in ['Debian', 'RedHat']
    - config_files | default([]) | length > 0
  block:
    - name: Copy config files to Linux host
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "{{ config_dest_dir | default('/etc/') }}{{ item }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      loop: "{{ config_files }}"
      register: linux_copy_result

    - name: Display Linux file copy results
      ansible.builtin.debug:
        msg: "Copied {{ linux_copy_result.results | selectattr('changed', 'equalto', true) | list | length }} file(s)"
      when: linux_copy_result is defined

# -----------------------------------------------------------------------------
# Windows — ansible.windows.win_copy
# -----------------------------------------------------------------------------
- name: Distribute config files to Windows hosts
  when:
    - ansible_os_family == 'Windows'
    - config_files | default([]) | length > 0
  block:
    - name: Ensure destination directory exists on Windows
      ansible.windows.win_file:
        path: "{{ config_dest_dir | default('C:\\ProgramData\\configs\\') }}"
        state: directory

    - name: Copy config files to Windows host
      ansible.windows.win_copy:
        src: "files/{{ item }}"
        dest: "{{ config_dest_dir | default('C:\\ProgramData\\configs\\') }}{{ item }}"
        backup: true
      loop: "{{ config_files }}"
      register: win_copy_result

    - name: Display Windows file copy results
      ansible.builtin.debug:
        msg: "Copied {{ win_copy_result.results | selectattr('changed', 'equalto', true) | list | length }} file(s)"
      when: win_copy_result is defined

# -----------------------------------------------------------------------------
# Filebeat configuration — Linux
# -----------------------------------------------------------------------------
- name: Deploy filebeat configuration on Linux
  when:
    - ansible_os_family in ['Debian', 'RedHat']
    - "'filebeat' in (packages | default([]))"
    - filebeat_elasticsearch_hosts is defined
  block:
    - name: Template filebeat.yml to Linux host
      ansible.builtin.template:
        src: filebeat.yml.j2
        dest: "{{ filebeat_config_path | default('/etc/filebeat/filebeat.yml') }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      register: linux_filebeat_config

    - name: Restart filebeat service on Linux
      ansible.builtin.service:
        name: filebeat
        state: restarted
        enabled: true
      when: linux_filebeat_config.changed

# -----------------------------------------------------------------------------
# Filebeat configuration — Windows
# -----------------------------------------------------------------------------
- name: Deploy filebeat configuration on Windows
  when:
    - ansible_os_family == 'Windows'
    - "'filebeat' in (packages | default([]))"
    - filebeat_elasticsearch_hosts is defined
  block:
    - name: Ensure filebeat config directory exists on Windows
      ansible.windows.win_file:
        path: C:/Program Files/Filebeat
        state: directory

    - name: Template filebeat.yml to Windows host
      ansible.windows.win_template:
        src: filebeat.yml.j2
        dest: "{{ filebeat_config_path | default('C:/ProgramData/Elastic/Beats/filebeat/filebeat.yml') }}"
        backup: true
      register: win_filebeat_config

    - name: Restart filebeat service on Windows
      ansible.windows.win_shell: |
        $svc = Get-Service -Name filebeat -ErrorAction SilentlyContinue
        if ($svc) {
            Restart-Service -Name filebeat -Force
            Set-Service -Name filebeat -StartupType Automatic
            Write-Host "Filebeat service restarted"
        } else {
            Write-Host "Filebeat service not found"
        }
      when: win_filebeat_config.changed
